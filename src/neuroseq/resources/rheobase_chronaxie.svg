           rdf:resource="http://creativecommons.org/licenses/publicdomain/" />
        <dc:description>The shortest duration of an electrical stimulus where the threshold amplitude is twice the rheobase - the minimum required for eliciting an ACTION POTENTIAL at any time period. It is a measure of the excitability of nerve or muscle tissue, and is characteristic of types and/or condition of the nerve or muscle cells in the tissue.</dc:description>
