[project]
site_name = "NeuroSeq"
site_url = "https://neuroseq.github.io/"
repo_url = "https://github.com/neuroseq/neuroseq"
extra_javascript = [
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]
nav = [
    { Home = "index.md" },
    { "Getting Started" = [
        { Installation = "getting_started/installation.md" },
        { Quickstart = "getting_started/quickstart.md" },
        { "GUI Overview" = "getting_started/gui_overview.md" },
        { "LLM Assistant (Experimental)" = "getting_started/chat_assistant.md" },
    ] },
    { Networks = [
        { Overview = "networks/overview.md" },
        { "Digital: Built-in Simulator" = "networks/simulations.md" },
        { "Digital: External Simulators" = "networks/external_simulators.md" },
        { "Biological: Holographic Stimulation" = "networks/holographic_stimulation.md" },
        { "Biological: Calcium Imaging Acquisition" = "networks/imaging_acquisition.md" },
        { "Neuromorphic: Hardware" = "networks/neuromorphic_hardware.md" },
    ] },
    { "Input Design" = [
        { Overview = "input_design/overview.md" },
        { "Static Input" = "input_design/static_input.md" },
        { "Dynamic Input" = "input_design/dynamic_input.md" },
        { "Holography Export" = "input_design/holography_export.md" },
        { "Patch Clamp Export" = "input_design/patch_clamp_export.md" },
    ] },
    { Readout = [
        { Overview = "readout/overview.md" },
        { Experiments = "readout/experiments.md" },
        { "Imaging Data" = "readout/imaging_data.md" },
        { "Patch-Clamp Data" = "readout/patch_clamp_data.md" },
    ] },
    { "Data Analysis" = [
        { "Analysis and Plugins" = "data_analysis/analysis.md" },
        { "Simulations vs. Experiments" = "data_analysis/simulations_and_experiments.md" },
    ] },
    { Examples = "examples.md" },
    { "Developer Guide" = [
        { Installation = "developer/developer_installation.md" },
        { Contributing = "developer/contributing.md" },
        { Testing = "developer/testing.md" },
        { Documentation = "developer/documentation.md" },
        { "Custom Simulators" = "developer/custom_simulators.md" },
        { "Analysis Plugins" = "developer/analysis_plugins.md" },
        { "Project History" = "developer/project_history.md" },
        { Releases = "developer/releases.md" },
        { "Desktop Shortcut" = "developer/desktop_shortcut.md" },
        { "Responsible Use of AI" = "developer/responsible_ai.md" },
    ] },
    { Troubleshooting = "common_issues.md" },
]


[project.theme]
variant = "classic"
favicon = "images/favicon.svg"
features = ["content.code.copy"]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]

# old URLs from before the docs/ folder reorganization
[project.plugins.redirects.redirect_maps]
"Neural Networks/overview.md" = "networks/overview.md"
"Neural Networks/simulations.md" = "networks/simulations.md"
"Neural Networks/run_external_simulators.md" = "networks/external_simulators.md"
"Neural Networks/multiphoton_holographic_stimulation.md" = "networks/holographic_stimulation.md"
"Neural Networks/scanimage_acquisition.md" = "networks/imaging_acquisition.md"
"Neural Networks/brainscales2_delivery.md" = "networks/neuromorphic_hardware.md"
"Input Design and Readout Analysis/overview.md" = "input_design/overview.md"
"Input Design and Readout Analysis/static_input_design.md" = "input_design/static_input.md"
"Input Design and Readout Analysis/stdp_synaptic_tuning.md" = "input_design/dynamic_input.md"
"Input Design and Readout Analysis/export_patch_clamp_stimuli.md" = "input_design/patch_clamp_export.md"
"Input Design and Readout Analysis/experiments.md" = "readout/experiments.md"
"Input Design and Readout Analysis/importing_imaging_data.md" = "readout/imaging_data.md"
"Input Design and Readout Analysis/importing_igor2_waves.md" = "readout/patch_clamp_data.md"
"Input Design and Readout Analysis/analysis_and_plugins.md" = "data_analysis/analysis.md"
"Input Design and Readout Analysis/simulations_and_experiments.md" = "data_analysis/simulations_and_experiments.md"
"developer/miscellaneous.md" = "developer/desktop_shortcut.md"
