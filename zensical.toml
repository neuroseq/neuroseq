[project]
site_name = "NeuroSeq"
site_url = "https://neuroseq.github.io/"
repo_url = "https://github.com/neuroseq/neuroseq"
extra_javascript = [
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]
nav = [
    { Home = "index.md" },
    { "Getting Started" = [
        { Installation = "getting_started/installation.md" },
        { Quickstart = "getting_started/quickstart.md" },
        { "GUI Overview" = "getting_started/gui_overview.md" },
        { "In-App LLM Assistant (Experimental)" = "getting_started/chat_assistant.md" },
    ] },
    { "Neural Networks" = [
        { Overview = "Neural Networks/overview.md" },
        { Simulations = "Neural Networks/simulations.md" },
        { "Run External Simulators" = "Neural Networks/run_external_simulators.md" },
        { "ScanImage Acquisition" = "Neural Networks/scanimage_acquisition.md" },
        { "Multiphoton Holographic Stimulation" = "Neural Networks/multiphoton_holographic_stimulation.md" },
        { "Deliver stimuli to BrainScaleS-2" = "Neural Networks/brainscales2_delivery.md" },
    ] },
    { "Input Design and Readout Analysis" = [
        { Overview = "Input Design and Readout Analysis/overview.md" },
        { "Input Design" = [
            { "Stimulation editor and static input" = "Input Design and Readout Analysis/static_input_design.md" },
            { "Design dynamic input" = "Input Design and Readout Analysis/stdp_synaptic_tuning.md" },
            { "Export stimuli for patch clamp recordings" = "Input Design and Readout Analysis/export_patch_clamp_stimuli.md" },
        ] },
        { "Readout Analysis" = [
            { Experiments = "Input Design and Readout Analysis/experiments.md" },
            { "Importing Igor2 Waves" = "Input Design and Readout Analysis/importing_igor2_waves.md" },
            { "Importing Imaging Data" = "Input Design and Readout Analysis/importing_imaging_data.md" },
            { "Analysis tools and plugins" = "Input Design and Readout Analysis/analysis_and_plugins.md" },
            { "Connecting simulations and experiments" = "Input Design and Readout Analysis/simulations_and_experiments.md" },
        ] },
    ] },
    { Examples = "examples.md" },
    { "Developer Guide" = [
        { "Installation and use" = "developer/developer_installation.md" },
        { Documentation = "developer/documentation.md" },
        { "Implementation of Custom Simulators" = "developer/custom_simulators.md" },
        { "Analysis plugins" = "developer/analysis_plugins.md" },
        { "Project data history" = "developer/project_history.md" },
        { "Making a release" = "developer/releases.md" },
        { Miscellaneous = "developer/miscellaneous.md" },
        { Testing = "developer/testing.md" },
        { Contributing = "developer/contributing.md" },
        { "Responsible use of AI" = "developer/responsible_ai.md" },
    ] },
    { Troubleshooting = "common_issues.md" },
]

[project.theme]
variant = "classic"
favicon = "images/favicon.svg"
features = ["content.code.copy"]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
