[project]
site_name = "NeuroSeq"
site_url = "https://neuroseq.github.io/"
repo_url = "https://github.com/neuroseq/neuroseq"
extra_javascript = [
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]
nav = [
    { Home = "index.md" },
    { "Getting Started" = [
        { Installation = "getting_started/installation.md" },
        { Quickstart = "getting_started/quickstart.md" },
        { "GUI Overview" = "getting_started/gui_overview.md" },
        { "LLM Assistant (Experimental)" = "getting_started/chat_assistant.md" },
    ] },
    { Networks = [
        { Overview = "networks/overview.md" },
        { "Digital: Brian2 Simulations" = "networks/simulations.md" },
        { "Digital: External Simulators" = "networks/external_simulators.md" },
        { "Biological: Holographic Stimulation" = "networks/holographic_stimulation.md" },
        { "Biological: ScanImage Acquisition" = "networks/scanimage_acquisition.md" },
        { "Neuromorphic: BrainScaleS-2" = "networks/brainscales2.md" },
    ] },
    { "Input Design" = [
        { Overview = "input_design/overview.md" },
        { "Static Input" = "input_design/static_input.md" },
        { "Dynamic Input" = "input_design/dynamic_input.md" },
        { "Patch Clamp Export" = "input_design/patch_clamp_export.md" },
    ] },
    { "Readout and Analysis" = [
        { Experiments = "readout/experiments.md" },
        { "Imaging Data" = "readout/imaging_data.md" },
        { "Igor2 Waves" = "readout/igor2_waves.md" },
        { "Analysis and Plugins" = "readout/analysis.md" },
        { "Simulations vs. Experiments" = "readout/simulations_and_experiments.md" },
    ] },
    { Examples = "examples.md" },
    { "Developer Guide" = [
        { Installation = "developer/developer_installation.md" },
        { Contributing = "developer/contributing.md" },
        { Testing = "developer/testing.md" },
        { Documentation = "developer/documentation.md" },
        { "Custom Simulators" = "developer/custom_simulators.md" },
        { "Analysis Plugins" = "developer/analysis_plugins.md" },
        { "Project History" = "developer/project_history.md" },
        { Releases = "developer/releases.md" },
        { Miscellaneous = "developer/miscellaneous.md" },
        { "Responsible Use of AI" = "developer/responsible_ai.md" },
    ] },
    { Troubleshooting = "common_issues.md" },
]


[project.theme]
variant = "classic"
favicon = "images/favicon.svg"
features = ["content.code.copy"]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
