[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuroseq"
description = "Qt-based desktop GUI application for computational neuroscience, combining Brian2 spiking neural network simulation with interactive stimulus design, multi-source experimental data import, and hardware export for holographic stimulation (HOLO4D .seq files)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrey Formozov" }]
requires-python = ">=3.12"
dependencies = [
    "brian2",
    "matplotlib",
    "pillow",
    "numpy",
    "scipy",
    "qtpy",
    "pyqt6",
    "pyqtgraph!=0.14.0",
    "h5py",
    "igor2",
    "qtawesome",
    "click",
    "fastplotlib",
    "pyparsing!=3.2.4",
    "platformdirs",
    "psutil",
    "nvidia-ml-py",
    "cellpose[gui]",
    "suite2p>=1.0",
    "torch==2.6.0; sys_platform == 'linux'",
    "torch; sys_platform == 'win32'",
    "torch; sys_platform == 'darwin'",
    "torchvision==0.21.0; sys_platform == 'linux'",
    "torchvision; sys_platform == 'win32'",
    "torchvision; sys_platform == 'darwin'",
    "tifffile",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://neuroseq.github.io/"
Documentation = "https://neuroseq.github.io/"
Source = "https://github.com/neuroseq/neuroseq"
Issues = "https://github.com/neuroseq/neuroseq/issues"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[project.optional-dependencies]
chat = [
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.40",
    "keyring>=24",
]

[project.scripts]
neuroseq = "neuroseq.__main__:main"

[dependency-groups]
docs = ["zensical==0.0.74"]
dev = [
    { include-group = "docs" },
    "memray ; platform_system != 'Windows'",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-qt",
    "pytest-randomly",
    "pytest-cov",
    "pytest-mock",
    "pytest-timeout",
    "pytest-xdist",
    "pytest-memray ; platform_system != 'Windows'",
    "diff-cover",
    "ruff",
]

[tool.hatch.version]
path = "src/neuroseq/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/neuroseq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["screenshot"]
log_cli = "true"
log_cli_level = "ERROR"
# abort and dump a per-thread traceback if any single test hangs for >60s
# (use the thread method so blocked Qt/GPU event loops are still interrupted)
timeout = 60
timeout_method = "thread"

[tool.ruff]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # numpy 2.0 support
    "NPY201",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
ignore_missing_imports = true
warn_redundant_casts = true
namespace_packages = false

[tool.coverage.run]
branch = true
source = ["./src/neuroseq"]
omit = ["src/neuroseq/resources/analysis_plugins/*"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",
    # Don't complain if non-runnable code isn't run:
    "if __name__ == .__main__.:",
    # Don't complain about abstract methods, they aren't run
    "@(abc\\.)?abstractmethod",
]
fail_under = 75

[tool.diff_cover]
fail_under = 75
