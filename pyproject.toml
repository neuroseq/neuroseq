[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formozov-project"
description = "Protoype GUI to edit and run neuron models"
readme = "README.md"
license = { text = "NONE" }
authors = [{ name = "SSC", email = "ssc@iwr.uni-heidelberg.de" }]
requires-python = ">=3.10"
dependencies = [
    "brian2",
    "numpy",
    "qtpy",
    "pyside6",
    "pyqtgraph",
    "h5py",
    "qtawesome",
    "click",
]
dynamic = ["version"]

[project.scripts]
formozov-project = "formozov_project.__main__:main"

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-qt",
    "pytest-randomly",
    "pytest-cov",
    "pytest-mock",
    "pytest-xvfb",
    "diff-cover",
]

[tool.hatch.version]
path = "src/formozov_project/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # numpy 2.0 support
    "NPY201",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.coverage.run]
branch = true
source = ["./src/formozov_project"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",
    # Don't complain if non-runnable code isn't run:
    "if __name__ == .__main__.:",
    # Don't complain about abstract methods, they aren't run
    "@(abc\\.)?abstractmethod",
]
fail_under = 80

[tool.diff_cover]
fail_under = 80
