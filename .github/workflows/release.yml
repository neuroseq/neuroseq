name: release

on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true
      - name: Test installed wheel
        run: |
          venv="$RUNNER_TEMP/wheel-test"
          uv venv --python 3.14 "$venv"
          uv pip install --python "$venv" --torch-backend cpu dist/*.whl
          "$venv/bin/neuroseq" --help
          "$venv/bin/python" -I -c "
          from importlib import resources
          from neuroseq.llm.system_prompt import DOCS_DIR, build_static_prompt
          assert DOCS_DIR == resources.files('neuroseq') / 'docs', DOCS_DIR
          assert '### docs/index.md' in build_static_prompt()
          "
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$("$RUNNER_TEMP/wheel-test/bin/python" -I -c "import neuroseq; print(neuroseq.__version__)")
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.repository == 'neuroseq/neuroseq' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/neuroseq/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
