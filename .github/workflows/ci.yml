name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conda-forge:
    runs-on: ${{ matrix.os }}
    name: "${{ matrix.os }} :: conda-forge"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-arm64-ssc"]
    defaults:
      run:
        shell: bash -leo pipefail {0}
    steps:
      - uses: actions/checkout@v6
      - name: Clone sequence-learning (ELISE) as sibling
        run: |
          git clone https://github.com/unibe-cns/sequence-learning.git ../sequence-learning
          git -C ../sequence-learning checkout cf790867
          # upstream pins requires-python >= 3.11; relax to match neuroseq's >= 3.10
          sed -i.bak 's/requires-python = ">=3.11"/requires-python = ">=3.10"/' ../sequence-learning/pyproject.toml
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
      - run: pip install . --no-deps
      - run: pip install ../sequence-learning
      - run: pytest -sv || pytest -sv || pytest -sv
  pypi:
    runs-on: ${{ matrix.os }}
    name: "${{ matrix.os }} :: pypi :: ${{ matrix.python-version }}"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-arm64-ssc"]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Clone sequence-learning (ELISE) as sibling
        run: |
          git clone https://github.com/unibe-cns/sequence-learning.git ../sequence-learning
          git -C ../sequence-learning checkout cf790867
          # upstream pins requires-python >= 3.11; relax to match neuroseq's >= 3.10
          sed -i.bak 's/requires-python = ">=3.11"/requires-python = ">=3.10"/' ../sequence-learning/pyproject.toml
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      - run: uv run pytest -sv --cov --cov-report=xml || uv run pytest -sv --cov --cov-report=xml || uv run pytest -sv --cov --cov-report=xml
        env:
          QT_API: pyside6
          PYTEST_QT_API: pyside6
      - run: uv run diff-cover coverage.xml -c pyproject.toml
  pre-commit:
    runs-on: "macos-arm64-ssc"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uvx prek run -a
