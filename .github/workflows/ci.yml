name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conda-forge:
    runs-on: ${{ matrix.os }}
    name: "${{ matrix.os }} :: conda-forge"
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "ubuntu-latest", "windows-latest"]
    defaults:
      run:
        shell: bash -leo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
      - run: pip install . --no-deps
      - run: pytest -sv
        env:
          NEUROSEQ_HEADLESS_TEST: TRUE
  pypi:
    runs-on: ${{ matrix.os }}
    name: "${{ matrix.os }} :: pypi :: ${{ matrix.python-version }}"
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "ubuntu-latest", "windows-latest"]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      - if: runner.os == 'Linux'
        uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true
      - run: uv run pytest -sv --cov --cov-report=xml
        env:
          NEUROSEQ_HEADLESS_TEST: TRUE
      - run: uv run diff-cover coverage.xml -c pyproject.toml
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx prek run -a
