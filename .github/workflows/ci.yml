name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    name: "${{ matrix.os }} :: ${{ matrix.python-version }}"
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-arm64-ssc"]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install uv
      - run: uv pip install --system -e .[tests] --verbose
      - run: python -m pytest
