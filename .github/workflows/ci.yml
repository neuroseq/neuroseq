name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conda-forge:
    runs-on: ${{ matrix.os }}
    name: "${{ matrix.os }} :: conda-forge"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-arm64-ssc"]
    defaults:
      run:
        shell: bash -leo pipefail {0}
    steps:
      - uses: actions/checkout@v5
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
      - run: pip install . --no-deps
      - run: pytest -sv || pytest -sv || pytest -sv
  pypi:
    runs-on: ${{ matrix.os }}
    name: "${{ matrix.os }} :: pypi :: ${{ matrix.python-version }}"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-arm64-ssc"]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      #      - run: uv run pytest -sv --cov --cov-report=xml || uv run pytest -sv --cov --cov-report=xml || uv run pytest -sv --cov --cov-report=xml
      #        env:
      #          QT_API: pyside6
      #          PYTEST_QT_API: pyside6
      - run: uv add pyqt6 && uv run pytest -sv || uv run pytest -sv || uv run pytest -sv
        env:
          QT_API: pyqt6
          PYTEST_QT_API: pyqt6
      - run: uv add pyqt5 && uv run pytest -sv || uv run pytest -sv || uv run pytest -sv
        env:
          QT_API: pyqt5
          PYTEST_QT_API: pyqt5
      - run: uv run diff-cover coverage.xml -c pyproject.toml
  pre-commit:
    runs-on: "macos-arm64-ssc"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uvx prek run -a
