name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conda-forge:
    runs-on: ${{ matrix.os }}
    name: "${{ matrix.os }} :: conda-forge"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-arm64-ssc"]
    defaults:
      run:
        shell: bash -leo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
      - run: pip install . --no-deps
      - run: pytest -sv
  pypi:
    runs-on: ${{ matrix.os }}
    name: "${{ matrix.os }} :: pypi :: ${{ matrix.python-version }}"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-arm64-ssc"]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install uv
      - run: uv pip install --system pyside6 pyqt5 pyqt6 -e .[tests]
      - run: QT_API=pyside6 PYTEST_QT_API=pyside6 pytest -sv --cov --cov-report=xml
      - run: QT_API=pyqt6 PYTEST_QT_API=pyqt6 pytest -sv
      - run: QT_API=pyqt5 PYTEST_QT_API=pyqt5 pytest -sv
      - run: diff-cover coverage.xml -c pyproject.toml
  pre-commit:
    runs-on: "macos-arm64-ssc"
    steps:
      - uses: actions/checkout@v4
      - run: pipx run pre-commit run -a
