name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    name: "${{ matrix.os }} :: ${{ matrix.python-version }}"
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-arm64-ssc"]
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install uv
      - run: uv pip install --system pyside6 pyqt5 pyqt6 -e .[tests]
      - run: QT_API=pyside6 PYTEST_QT_API=pyside6 pytest -sv --cov --cov-report=xml
      - run: QT_API=pyqt6 PYTEST_QT_API=pyqt6 pytest -sv
      - run: QT_API=pyqt5 PYTEST_QT_API=pyqt5 pytest -sv
      - run: diff-cover coverage.xml -c pyproject.toml
  pre-commit:
    runs-on: "macos-arm64-ssc"
    steps:
      - uses: actions/checkout@v4
      - run: pipx run pre-commit run -a
