name: neuroseq
channels:
  - conda-forge
dependencies:
  - python
  - brian2
  - numpy
  - qtpy
  - matplotlib
  - pillow
  - pyqt6
  - pyqtgraph != 0.14.0
  - h5py
  - qtawesome
  - click
  - pyparsing !=3.2.4
  - psutil
  - nvidia-ml-py
  # test deps
  - pytest
  - pytest-qt
  - pytest-mock
  - pytest-timeout
  - pip
  - pip:
      - fastplotlib
      - igor2
