site_name: Neuroseq
site_url: https://ssciwr.github.io/neuroseq
repo_url: https://github.com/ssciwr/neuroseq
theme:
  name: material
  favicon: images/favicon.svg
  features:
    - content.code.copy
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - attr_list
  - md_in_html
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting_started/installation.md
    - Quickstart: getting_started/quickstart.md
  - User Guide:
    - GUI Overview: user_guide/gui_overview.md
    - Simulations: user_guide/simulations.md
    - Experiments: user_guide/experiments.md
    - Data Import:
      - Cellpose Import: user_guide/import_cellpose.md
      - Patch Clamp Import: user_guide/import_patchclamp.md
  - Examples: examples.md
  - Developer Guide:
    - Installation and use: developer/developer_installation.md
    - Documentation: developer/documentation.md
    - Miscellaneous: developer/miscellaneous.md
    - Testing: developer/testing.md
    - Contributing: developer/contributing.md
  - Troubleshooting: common_issues.md
